name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check
        run: |
          test -z "$(gofmt -l src)"
          go vet ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            suffix=""
            if [ "$goos" = "windows" ]; then suffix=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w" -o "dist/simpleharness-$goos-$goarch$suffix" ./src
          done
          cd dist
          sha256sum simpleharness-* > SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "SimpleHarness $GITHUB_REF_NAME" --notes-file .github/release-notes.md
